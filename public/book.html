<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a Court — Snow Bear CourtOS</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div class="loading-overlay" id="pcLoader"><div class="bounce-ball"></div><div class="fw-bold text-success">Loading courts…</div></div>

<nav class="navbar navbar-pc sticky-top">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2 fw-bold brand-home" href="/">
      <span class="brand-logo-slot" data-size="42"></span>
      <span class="company-name">CourtOS</span></a>
    <div class="d-flex gap-2 align-items-center">
      <button class="btn btn-sm btn-outline-secondary rounded-circle p-2" onclick="toggleTheme()"><i class="theme-icon bi bi-moon-stars"></i></button>
      <a href="#find" class="btn-pc-outline btn btn-sm" onclick="showFind()"><i class="bi bi-search me-1"></i>Find My Booking</a>
    </div>
  </div>
</nav>

<div class="container py-4" style="max-width:1000px">
  <!-- BOOKING WIZARD -->
  <div id="wizardWrap">
    <div class="text-center mb-4 fade-up">
      <h2 class="section-title">Book a Court</h2>
      <p class="text-secondary">No sign-up needed — reserve your slot in under a minute.</p>
    </div>
    <div class="card-pc p-3 mb-3">
      <div class="d-flex justify-content-between overflow-auto gap-2" id="stepBar"></div>
    </div>
    <div class="card-pc p-4" id="wizardBody"></div>
  </div>

  <!-- FIND MY BOOKING -->
  <div id="findWrap" class="d-none">
    <div class="text-center mb-4">
      <h2 class="section-title">Find My Booking</h2>
      <p class="text-secondary">Enter your booking reference and the mobile number you booked with.</p>
    </div>
    <div class="card-pc p-4 mx-auto" style="max-width:520px">
      <div class="mb-3"><label class="form-label small">Booking Reference</label>
        <input class="form-control" id="findRef" placeholder="PB-20260717-000001"></div>
      <div class="mb-3"><label class="form-label small">Mobile Number</label>
        <input class="form-control" id="findMobile" placeholder="09XXXXXXXXX"></div>
      <button class="btn btn-pc w-100" onclick="findBooking()"><i class="bi bi-search me-2"></i>Find Booking</button>
      <div class="text-center mt-3"><a class="small text-success pointer" onclick="showWizard()">← Back to booking</a></div>
    </div>
    <div id="findResult" class="mx-auto mt-3" style="max-width:520px"></div>
  </div>
</div>

<!-- Confirmation modal -->
<div class="modal fade" id="confirmModal" data-bs-backdrop="static"><div class="modal-dialog modal-dialog-centered"><div class="modal-content card-pc">
  <div class="modal-body text-center p-4" id="confirmBody"></div>
</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/book.js"></script>
</body>
</html>
