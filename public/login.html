<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff &amp; Admin Login — Snow Bear CourtOS</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="container-fluid min-vh-100 d-flex align-items-center" style="background:linear-gradient(120deg,#064e3b 0%,#065f46 40%,#1e3a8a 100%)">
  <div class="container" style="max-width:430px">
    <div class="text-center mb-4">
      <a href="index.html" class="text-decoration-none d-inline-flex align-items-center gap-2 fw-bold fs-4 text-white">
        <span class="brand-logo-slot" data-size="56"></span>
        Snow Bear <span style="color:#bef264">CourtOS</span></a>
    </div>
    <div class="card-pc p-4 p-md-5 fade-up">
      <h4 class="fw-bold mb-1">Admin &amp; Staff Portal 🔐</h4>
      <p class="text-secondary small mb-4">For court admins and staff. Customers don't need an account — <a href="book.html" class="text-success fw-semibold">book here</a>.</p>
      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label">Email or Username</label>
          <div class="input-group"><span class="input-group-text"><i class="bi bi-person"></i></span>
            <input class="form-control" name="identifier" required autofocus></div>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <div class="input-group"><span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" name="password" id="pwd" required>
            <button class="btn btn-outline-secondary" type="button" onclick="const p=document.getElementById('pwd');p.type=p.type==='password'?'text':'password'"><i class="bi bi-eye"></i></button></div>
        </div>
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="form-check"><input class="form-check-input" type="checkbox" name="remember" id="rem">
            <label class="form-check-label small" for="rem">Remember me</label></div>
          <a href="#" class="small text-success fw-semibold" data-bs-toggle="modal" data-bs-target="#forgotModal">Forgot password?</a>
        </div>
        <div class="alert alert-danger d-none py-2 small" id="loginError"></div>
        <button class="btn btn-pc w-100 py-2" id="loginBtn"><i class="bi bi-box-arrow-in-right me-2"></i>Log In</button>
      </form>
    </div>
    <p class="text-center text-white-50 small mt-3 mb-0">Super Admin: <code class="text-warning">superadmin / SnowBear@2026</code></p>
    <p class="text-center text-white-50 small">Demo Court Admin: <code class="text-warning">koko123 / koko123</code></p>
  </div>
</div>

<!-- Forgot password modal -->
<div class="modal fade" id="forgotModal">
  <div class="modal-dialog modal-dialog-centered"><div class="modal-content card-pc">
    <div class="modal-header border-0"><h5 class="modal-title fw-bold">Reset Password</h5>
      <button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
      <p class="small text-secondary">Enter your account email and we'll send you a reset link.</p>
      <input type="email" class="form-control mb-3" id="forgotEmail" placeholder="you@email.com">
      <div class="alert alert-info small d-none" id="forgotResult"></div>
      <button class="btn btn-pc w-100" onclick="sendReset()">Send Reset Link</button>
    </div>
  </div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const f = new FormData(e.target);
  const err = document.getElementById('loginError'), btn = document.getElementById('loginBtn');
  err.classList.add('d-none');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Logging in…';
  try {
    const res = await API.post('/api/auth/login', {
      identifier: f.get('identifier'), password: f.get('password'), remember: !!f.get('remember')
    });
    API.setSession(res.token, res.user, !!f.get('remember'), res.subscription, res.company);
    toast(`Welcome back, ${res.user.firstName}!`);
    if (res.user.roleId === 0) location.href = 'superadmin.html';
    else if (res.user.roleId >= 1 && res.user.roleId <= 4) location.href = 'admin.html';
    else location.href = 'dashboard.html';
  } catch (ex) {
    err.textContent = ex.message; err.classList.remove('d-none');
    btn.disabled = false;
    btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Log In';
  }
});
async function sendReset() {
  const box = document.getElementById('forgotResult');
  try {
    const res = await API.post('/api/auth/forgot', { email: document.getElementById('forgotEmail').value });
    box.classList.remove('d-none');
    box.innerHTML = res.devResetLink
      ? `Reset email sent. <strong>Demo mode:</strong> <a href="${res.devResetLink}">click here to reset now</a>.`
      : res.message;
  } catch (ex) { box.classList.remove('d-none'); box.textContent = ex.message; }
}
</script>
</body>
</html>
