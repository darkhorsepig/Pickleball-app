<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password — PickleCourt</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="container min-vh-100 d-flex align-items-center justify-content-center">
  <div class="card-pc p-4 p-md-5 fade-up" style="max-width:440px;width:100%">
    <h4 class="fw-bold mb-3"><i class="bi bi-shield-lock text-success me-2"></i>Set a New Password</h4>
    <form id="resetForm">
      <div class="mb-3"><label class="form-label">New Password</label>
        <input type="password" class="form-control" name="password" minlength="8" required>
        <div class="form-text">Minimum 8 characters</div></div>
      <div class="mb-3"><label class="form-label">Confirm New Password</label>
        <input type="password" class="form-control" name="confirm" required></div>
      <div class="alert alert-danger d-none py-2 small" id="resetError"></div>
      <button class="btn btn-pc w-100">Update Password</button>
    </form>
  </div>
</div>
<script src="js/common.js"></script>
<script>
document.getElementById('resetForm').addEventListener('submit', async e => {
  e.preventDefault();
  const f = new FormData(e.target), err = document.getElementById('resetError');
  err.classList.add('d-none');
  if (f.get('password') !== f.get('confirm')) {
    err.textContent = 'Passwords do not match.'; err.classList.remove('d-none'); return;
  }
  try {
    await API.post('/api/auth/reset', {
      token: new URLSearchParams(location.search).get('token'),
      password: f.get('password')
    });
    toast('Password updated! Redirecting to login…');
    setTimeout(() => location.href = 'login.html', 1200);
  } catch (ex) { err.textContent = ex.message; err.classList.remove('d-none'); }
});
</script>
</body>
</html>
